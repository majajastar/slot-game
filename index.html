<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheLuxe Slot Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .connection-panel {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }
    
    .connection-panel input {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      width: 200px;
    }
    
    .connection-panel input::placeholder {
      color: #aaa;
    }
    
    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      background: #ffd700;
      color: #1a1a2e;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    button:hover {
      background: #ffed4e;
      transform: translateY(-2px);
    }
    
    button:disabled {
      background: #666;
      cursor: not-allowed;
      transform: none;
    }
    
    .status {
      display: inline-block;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 10px;
    }
    
    .status.connected {
      background: #28a745;
    }
    
    .status.disconnected {
      background: #dc3545;
    }
    
    .status.connecting {
      background: #ffc107;
      color: #000;
    }
    
    .game-panel {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    
    .slot-machine {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 20px;
    }
    
    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin: 20px 0;
    }
    
    .cell {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #2a2a4a 0%, #1a1a3a 100%);
      border: 2px solid #444;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      transition: all 0.3s;
    }
    
    .cell.winner {
      border-color: #ffd700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
      animation: pulse 1s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .symbol-WILD { color: #ff6b6b; }
    .symbol-SYM_1 { color: #ffd700; }
    .symbol-SYM_2 { color: #c0c0c0; }
    .symbol-SYM_3 { color: #cd7f32; }
    .symbol-SYM_4 { color: #90ee90; }
    .symbol-SYM_5, .symbol-SYM_6, .symbol-SYM_7, .symbol-SYM_8, .symbol-SYM_9 { color: #87ceeb; }
    
    .controls {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 20px;
    }
    
    .control-group {
      margin-bottom: 15px;
    }
    
    .control-group label {
      display: block;
      margin-bottom: 5px;
      color: #aaa;
    }
    
    .control-group input, .control-group select {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background: rgba(255,255,255,0.2);
      color: #fff;
    }
    
    .info-panel {
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      padding: 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 5px;
    }
    
    .info-label {
      color: #aaa;
    }
    
    .info-value {
      font-weight: bold;
      color: #ffd700;
    }
    
    .logs {
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
    }
    
    .log-entry {
      margin: 5px 0;
      padding: 5px;
      border-left: 3px solid #444;
      padding-left: 10px;
    }
    
    .log-entry.send {
      border-color: #28a745;
    }
    
    .log-entry.receive {
      border-color: #007bff;
    }
    
    .log-entry.error {
      border-color: #dc3545;
    }
    
    .win-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
      color: #1a1a2e;
      padding: 40px;
      border-radius: 20px;
      font-size: 2rem;
      font-weight: bold;
      display: none;
      z-index: 1000;
      box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
    }
    
    .win-popup.show {
      display: block;
      animation: winPopup 2s ease-out forwards;
    }
    
    @keyframes winPopup {
      0% { transform: translate(-50%, -50%) scale(0); }
      50% { transform: translate(-50%, -50%) scale(1.1); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }
    
    @media (max-width: 768px) {
      .game-panel {
        grid-template-columns: 1fr;
      }
      
      .cell {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💎 TheLuxe Slot Game</h1>
    
    <div class="connection-panel">
      <h3>Connection</h3>
      <input type="text" id="wsUrl" placeholder="WebSocket URL" value="wss://br9131tad1.execute-api.ap-southeast-1.amazonaws.com/uat">
      <input type="text" id="token" placeholder="Token" value="demo_token">
      <input type="text" id="lang" placeholder="Language" value="en">
      <button id="connectBtn" onclick="connect()">Connect</button>
      <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
      <span id="status" class="status disconnected">Disconnected</span>
    </div>
    
    <div class="game-panel">
      <div class="slot-machine">
        <h3>Slot Grid (4x5)</h3>
        <div class="grid-container" id="slotGrid">
          <!-- Grid cells will be generated here -->
        </div>
        
        <div class="info-panel">
          <div class="info-row">
            <span class="info-label">Balance:</span>
            <span class="info-value" id="balance">0</span>
          </div>
          <div class="info-row">
            <span class="info-label">Last Win:</span>
            <span class="info-value" id="lastWin">0</span>
          </div>
          <div class="info-row">
            <span class="info-label">Game:</span>
            <span class="info-value" id="gameName">-</span>
          </div>
        </div>
      </div>
      
      <div class="controls">
        <h3>Controls</h3>
        
        <div class="control-group">
          <label>Bet Amount</label>
          <select id="betAmount">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
        
        <div class="control-group">
          <label>Lines</label>
          <select id="lineCount">
            <option value="1">1 Line</option>
            <option value="5">5 Lines</option>
            <option value="10">10 Lines</option>
            <option value="14" selected>14 Lines (All)</option>
          </select>
        </div>
        
        <button id="spinBtn" onclick="spin()" disabled>🎰 SPIN</button>
        <button onclick="syncRoomInfo()" disabled id="syncBtn">Sync Room</button>
        <button onclick="clearLogs()">Clear Logs</button>
        
        <div class="info-panel" style="margin-top: 20px;">
          <div class="info-row">
            <span class="info-label">Min Bet:</span>
            <span class="info-value" id="minBet">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Max Bet:</span>
            <span class="info-value" id="maxBet">-</span>
          </div>
        </div>
      </div>
    </div>
    
    <div class="logs" id="logs">
      <div class="log-entry">Logs will appear here...</div>
    </div>
  </div>
  
  <div class="win-popup" id="winPopup">
    🎉 Win: <span id="winAmount">0</span>! 🎉
  </div>

  <script>
    // Symbol emojis mapping
    const symbolEmojis = {
      'WILD': '💎',
      'SCATTER': '⭐',
      'SYM_1': '👑',
      'SYM_2': '💍',
      'SYM_3': '🏆',
      'SYM_4': '💵',
      'SYM_5': '🎲',
      'SYM_6': '🎯',
      'SYM_7': '🎰',
      'SYM_8': '🪙',
      'SYM_9': '💠'
    };
    
    let socket = null;
    let messageHandler = null;
    let pingInterval = null;
    
    // Initialize grid
    function initGrid() {
      const grid = document.getElementById('slotGrid');
      grid.innerHTML = '';
      for (let i = 0; i < 20; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = `cell-${i}`;
        cell.textContent = '❓';
        grid.appendChild(cell);
      }
    }
    
    initGrid();
    
    function log(message, type = 'info') {
      const logs = document.getElementById('logs');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logs.insertBefore(entry, logs.firstChild);
    }
    
    function updateStatus(status) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = status;
      statusEl.className = `status ${status.toLowerCase()}`;
    }
    
    function createMessage(type, data) {
      return JSON.stringify({ type, data });
    }
    
    function connect() {
      const wsUrl = document.getElementById('wsUrl').value;
      const token = document.getElementById('token').value;
      const lang = document.getElementById('lang').value;
      
      const fullUrl = `${wsUrl}?token=${encodeURIComponent(token)}&lang=${encodeURIComponent(lang)}`;
      
      log(`Connecting to ${wsUrl}...`, 'info');
      updateStatus('Connecting');
      
      socket = new WebSocket(fullUrl);
      
      socket.onopen = () => {
        log('WebSocket connected', 'receive');
        updateStatus('Connected');
        document.getElementById('connectBtn').disabled = true;
        document.getElementById('disconnectBtn').disabled = false;
        document.getElementById('spinBtn').disabled = false;
        document.getElementById('syncBtn').disabled = false;
        
        // Send login
        sendMessage('0', [{ subType: 0 }]);
      };
      
      socket.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);
          log(`Received: ${JSON.stringify(message).substring(0, 200)}...`, 'receive');
          handleMessage(message);
        } catch (e) {
          log(`Invalid message: ${e.message}`, 'error');
        }
      };
      
      socket.onerror = (err) => {
        log(`WebSocket error`, 'error');
        updateStatus('Disconnected');
      };
      
      socket.onclose = () => {
        log('WebSocket closed', 'error');
        updateStatus('Disconnected');
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('disconnectBtn').disabled = true;
        document.getElementById('spinBtn').disabled = true;
        document.getElementById('syncBtn').disabled = true;
        
        if (pingInterval) {
          clearInterval(pingInterval);
          pingInterval = null;
        }
      };
    }
    
    function disconnect() {
      if (socket) {
        socket.close();
      }
    }
    
    function sendMessage(type, data) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        log('Cannot send: WebSocket not connected', 'error');
        return;
      }
      
      const msg = createMessage(type, data);
      socket.send(msg);
      log(`Sent: ${msg.substring(0, 100)}...`, 'send');
    }
    
    function handleMessage(message) {
      if (message.errCode !== 0) {
        log(`Server error: ${message.errCode}`, 'error');
        return;
      }
      
      const { type, data } = message.vals;
      
      switch (type) {
        case 1: // Login
          handleLogin(data);
          break;
        case 3: // Lobby
          handleLobby(data);
          break;
        case 100000: // Game messages
          handleGameMessage(data);
          break;
      }
    }
    
    function handleLogin(data) {
      log(`Login success - Session: ${data.sessionId}, Player: ${data.playerId}`, 'receive');
      // Send lobby request
      sendMessage('2', [{ subType: 0 }]);
    }
    
    function handleLobby(data) {
      log(`Lobby - Game: ${data.gameId}, Balance: ${data.balance}`, 'receive');
      document.getElementById('balance').textContent = data.balance.toLocaleString();
      
      // Join room and sync
      sendMessage('100000', [{ subType: 100004 }]); // joinRoom
      sendMessage('100000', [{ subType: 100070, subData: [{ opCode: 'SyncRoomInfo' }] }]);
      
      // Start ping interval
      if (pingInterval) clearInterval(pingInterval);
      pingInterval = setInterval(() => {
        syncRoomInfo();
      }, 20000);
    }
    
    function handleGameMessage(data) {
      const subType = data.subType;
      const subData = data.subData?.[0];
      
      if (subType === 100005) {
        // Join room
        handleJoinRoom(subData);
      } else if (subType === 100071) {
        handleSubData(subData);
      }
    }
    
    function handleJoinRoom(data) {
      log(`Joined room - Game: ${data.gameType}, Balance: ${data.balance}`, 'receive');
      document.getElementById('balance').textContent = data.balance.toLocaleString();
      
      if (data.betInfo && data.betInfo[0]) {
        const betInfo = data.betInfo[0];
        document.getElementById('gameName').textContent = betInfo.gameName;
        document.getElementById('minBet').textContent = betInfo.minBet;
        document.getElementById('maxBet').textContent = betInfo.maxBet;
      }
    }
    
    function handleSubData(subData) {
      if (!subData || !subData.opCode) return;
      
      switch (subData.opCode) {
        case 'SyncRoomInfo':
          if (subData.roomInfo) {
            document.getElementById('minBet').textContent = subData.roomInfo.minBet;
            document.getElementById('maxBet').textContent = subData.roomInfo.maxBet;
          }
          break;
          
        case 'SetBet':
          handleSetBet(subData);
          break;
      }
    }
    
    function handleSetBet(subData) {
      if (!subData.betInfo || !subData.betInfo[0]) return;
      
      const info = subData.betInfo[0];
      log(`Spin result - Win: ${info.gameResult.totalWinAmount}, Balance: ${info.finalBalance}`, 'receive');
      
      // Update balance
      document.getElementById('balance').textContent = info.finalBalance.toLocaleString();
      document.getElementById('lastWin').textContent = info.gameResult.totalWinAmount.toLocaleString();
      
      // Update grid
      updateGrid(info.gameResult.grid);
      
      // Highlight winning cells
      if (info.gameResult.lineWins && info.gameResult.lineWins.length > 0) {
        highlightWins(info.gameResult.lineWins);
        
        // Show win popup
        if (info.gameResult.totalWinAmount > 0) {
          showWinPopup(info.gameResult.totalWinAmount);
        }
      }
      
      // Re-enable spin button
      document.getElementById('spinBtn').disabled = false;
      document.getElementById('spinBtn').textContent = '🎰 SPIN';
    }
    
    function updateGrid(grid) {
      // grid is 4 rows x 5 cols
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 5; c++) {
          const cellIndex = r * 5 + c;
          const cell = document.getElementById(`cell-${cellIndex}`);
          const symbol = grid[r][c];
          cell.textContent = symbolEmojis[symbol] || symbol;
          cell.className = `cell symbol-${symbol}`;
        }
      }
    }
    
    function highlightWins(lineWins) {
      // Clear previous winners
      document.querySelectorAll('.cell.winner').forEach(cell => {
        cell.classList.remove('winner');
      });
      
      // Highlight new winners
      lineWins.forEach(lineWin => {
        lineWin.positions.forEach(pos => {
          const [r, c] = pos;
          const cellIndex = r * 5 + c;
          const cell = document.getElementById(`cell-${cellIndex}`);
          if (cell) cell.classList.add('winner');
        });
      });
    }
    
    function showWinPopup(amount) {
      const popup = document.getElementById('winPopup');
      document.getElementById('winAmount').textContent = amount.toLocaleString();
      popup.classList.add('show');
      setTimeout(() => {
        popup.classList.remove('show');
      }, 2000);
    }
    
    function spin() {
      const bet = document.getElementById('betAmount').value;
      const line = document.getElementById('lineCount').value;
      
      document.getElementById('spinBtn').disabled = true;
      document.getElementById('spinBtn').textContent = 'Spinning...';
      
      log(`Spinning with bet: ${bet}, lines: ${line}`, 'send');
      
      sendMessage('100000', [{
        subType: 100070,
        subData: [{ opCode: 'SetBet', message: { bet: parseInt(bet), line: parseInt(line) } }]
      }]);
    }
    
    function syncRoomInfo() {
      sendMessage('100000', [{ subType: 100070, subData: [{ opCode: 'SyncRoomInfo' }] }]);
    }
    
    function clearLogs() {
      document.getElementById('logs').innerHTML = '<div class="log-entry">Logs cleared...</div>';
    }
  </script>
</body>
</html>
